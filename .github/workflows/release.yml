
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate calendar version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"

          if [[ ! "$TAG" =~ ^([0-9]{2})\.([0-9]{2})\.([0-9]+)$ ]]; then
            echo "Expected version format: vYY.MM.PATCH"
            exit 1
          fi

          MONTH=$((10#${BASH_REMATCH[2]}))
          if (( MONTH < 1 || MONTH > 12 )); then
            echo "Month must be between 01 and 12"
            exit 1
          fi

          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "compatpy"))')

          if [[ "$TAG" != "$CARGO_VERSION" ]]; then
            echo "Tag ($TAG) does not match Cargo version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Verify package
        run: cargo publish --dry-run --locked

  create-draft-release:
    name: Create draft release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create draft if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --generate-notes
          fi

  upload-binaries:
    name: Build ${{ matrix.target }}
    needs: create-draft-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Build and upload portable binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: compatpy
          target: ${{ matrix.target }}
          ref: refs/tags/${{ github.ref_name }}
          token: ${{ github.token }}
          locked: true
          checksum: sha256
          include: LICENSE,README.md

  windows-msi:
    name: Build Windows MSI
    needs: create-draft-release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX Toolset
        shell: powershell
        run: choco install wixtoolset --yes --no-progress

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Initialize MSI configuration
        shell: powershell
        run: |
          if (!(Test-Path "wix/main.wxs")) {
            cargo wix init
          }

      - name: Build MSI
        run: cargo wix

      - name: Upload MSI
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $msi = Get-ChildItem "target/wix" -Filter "*.msi" |
            Select-Object -First 1

          if (!$msi) {
            throw "No MSI was produced"
          }

          gh release upload "$env:TAG" "$($msi.FullName)" --clobber

  publish-crate:
    name: Publish to crates.io
    needs: [upload-binaries, windows-msi]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  publish-release:
    name: Publish GitHub Release
    needs: publish-crate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          RELEASE_ID=$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq .id)

          gh api \
            --method PATCH \
            "repos/$REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false
